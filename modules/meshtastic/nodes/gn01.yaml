# start of Meshtastic configure yaml
channel_url: "$channel_url"
config:
  security:
    privateKey: "$privateKey"
    publicKey: "base64:F3HaGNoKXzf7B3p1jOIXT7Bf3fD5hlBOCm/AI1rHZkQ="
    serialEnabled: true
  bluetooth:
    enabled: true
    fixedPin: "$fixedPin"
  device:
    ledHeartbeatDisabled: true
    nodeInfoBroadcastSecs: 10800
    role: CLIENT
    tzdef: GMT-3
  display:
    screenOnSecs: 600
  lora:
    hopLimit: 3
    ignoreMqtt: true
    region: EU_868
    sx126xRxBoostedGain: true
    txEnabled: true
    txPower: 27
    usePreset: true
  network:
    ntpServer: meshtastic.pool.ntp.org
  position:
    broadcastSmartMinimumDistance: 100
    broadcastSmartMinimumIntervalSecs: 30
    gpsEnGpio: 34
    gpsMode: ENABLED
    gpsUpdateInterval: 120
    positionBroadcastSecs: 900
    positionBroadcastSmartEnabled: true
    positionFlags: 811
  power:
    lsSecs: 300
    minWakeSecs: 10
    sdsSecs: 4294967295
    waitBluetoothSecs: 60
module_config:
  ambientLighting:
    blue: 8
    current: 10
    green: 26
    red: 203
  cannedMessage:
    enabled: true
  detectionSensor:
    detectionTriggerType: LOGIC_HIGH
    minimumBroadcastSecs: 45
  mqtt:
    address: mqtt.meshtastic.org
    encryptionEnabled: true
    root: msh/EU_868
    username: "$username"
    password: "$password"
  telemetry:
    deviceUpdateInterval: 2147483647
owner: gn01
owner_short: gn01
